name: AI Auto Blogger

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run AI Blog Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python auto_blog.py

      - name: Push to Repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generated AI SEO Blogs [skip ci]"
          file_pattern: "public/blogs.json"
          commit_user_name: "AI Blog Bot"
          commit_user_email: "bot@kryptonapex.com"

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krypton Apex - AI Crypto Blogs & SEO Guides</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
</head>
<body class="bg-[#05070B] text-slate-200 min-h-screen font-sans p-6">
    <div class="max-w-4xl mx-auto">
        <header class="py-8 border-b border-slate-800 mb-8 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wider text-white">KRYPTON APEX <span class="text-emerald-400 text-sm">BLOGS</span></h1>
            <a href="/" class="text-sm text-slate-400 hover:text-emerald-400 transition-colors">← Back to Terminal</a>
        </header>
        
        <main>
            <h2 class="text-xl font-semibold mb-6 text-white">Latest AI-Generated SEO Insights</h2>
            <div id="blog-container" class="space-y-6">
                <p class="text-emerald-400 text-sm animate-pulse">Loading articles...</p>
            </div>
        </main>
        
        <footer class="mt-16 py-6 border-t border-slate-800 text-center text-xs text-slate-500">
            Krypton Apex © 2026 — All Rights Reserved.
        </footer>
    </div>

    <script>
        fetch('/blogs.json')
            .then(res => res.json())
            .then(blogs => {
                const container = document.getElementById('blog-container');
                container.innerHTML = '';
                if(blogs.length === 0) {
                    container.innerHTML = '<p class="text-slate-400">No articles yet.</p>';
                    return;
                }
                blogs.forEach(blog => {
                    const card = document.createElement('div');
                    card.className = "bg-slate-900/50 border border-slate-800 rounded-2xl p-6 shadow-xl";
                    card.innerHTML = `
                        <span class="text-xs text-emerald-400 font-mono">${blog.date}</span>
                        <h3 class="text-xl font-bold text-white mt-2 mb-4">${blog.title}</h3>
                        <div class="text-slate-300 space-y-4 text-sm">${blog.content}</div>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(err => {
                document.getElementById('blog-container').innerHTML = '<p class="text-slate-400">Articles will appear here shortly.</p>';
            });
    </script>
</body>
</html>
